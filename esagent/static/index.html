<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>E.S. Agent</title>
<link rel="stylesheet" href="/static/companion.css">
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1c1a; --muted: #6d6a64; --line: #e4e1da;
  --accent: #6a4bd8; --accent-ink: #ffffff; --user: #ece8ff; --notice: #f1efe8;
  --ok: #2f8a4f; --warn: #b4542b; --due: #a26400;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161514; --panel: #1f1e1c; --ink: #ecebe7; --muted: #9c988f; --line: #33312d;
    --accent: #9b83ff; --accent-ink: #14121c; --user: #2c2645; --notice: #26241f;
    --ok: #6cc58b; --warn: #f0906a; --due: #e0b050;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.6 "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif;
  display: grid; grid-template-rows: auto 1fr;
}
header {
  display: flex; align-items: center; gap: 12px; padding: 10px 18px;
  border-bottom: 1px solid var(--line); background: var(--panel);
}
header h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
header h1 span { color: var(--accent); }
#status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
#status i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
#status.ok i { background: var(--ok); } #status.bad i { background: var(--warn); }
#gstatus { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
#gstatus i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
#gstatus.ok i { background: var(--ok); } #gstatus.bad i { background: var(--warn); } #gstatus.wait i { background: var(--due); }
.spacer { flex: 1; }
#modesw { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; gap: 2px; }
#modesw button { background: transparent; color: var(--muted); border-radius: 999px; padding: 3px 12px; font-size: 12.5px; }
#modesw button.on { background: var(--accent); color: var(--accent-ink); }
#modesw button:not(.on):hover { color: var(--ink); }
header button { padding: 4px 10px; font-size: 12.5px; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 0; }
@media (max-width: 820px) { main { grid-template-columns: 1fr; } aside { border-left: 0; border-top: 1px solid var(--line); }
  #sidescroll { max-height: 50vh; } }

/* chat */
#chat { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
#live { display: flex; flex-direction: column; gap: 10px; }
#log { overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 82%; padding: 9px 13px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
.msg.user { align-self: flex-end; background: var(--user); }
.msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
.msg.es { align-self: flex-start; background: var(--panel); border: 1px dashed var(--line); font-size: 13px; }
.msg.queued { opacity: .55; }
.msg.pending small { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }
.msg.queued small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
.msg.thinking { align-self: flex-start; color: var(--muted); font-size: 12.5px; background: transparent; padding: 4px 2px; }
.msg.thinking b { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; }
.msg.thinking .detail { display: block; font-size: 12px; margin-top: 2px; }
.msg.thinking .partial { display: block; margin-top: 6px; padding: 8px 12px; border-radius: 12px; color: var(--ink);
  font-size: 14px; background: var(--panel); border: 1px dashed var(--line); }
.msg.thinking .dots { display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%;
  background: var(--accent); animation: pulse 1s ease-in-out infinite; vertical-align: middle; }
@keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
.badge { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--user); color: var(--accent); }
form#send { position: relative; }
#cmdpop {
  position: absolute; left: 18px; right: 90px; bottom: calc(100% - 6px); max-height: 260px; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.18);
  padding: 4px; z-index: 5;
}
#cmdpop .cmd { padding: 5px 9px; border-radius: 7px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
#cmdpop .cmd.sel, #cmdpop .cmd:hover { background: var(--user); }
#cmdpop .args { color: var(--muted); font-size: 12px; }
#cmdpop .desc { margin-left: auto; color: var(--muted); font-size: 12px; }
.msg.notice { align-self: flex-start; background: var(--notice); color: var(--muted); font-size: 12.5px; border-radius: 8px; }
.empty { color: var(--muted); margin: auto; text-align: center; }
form#send { display: flex; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--line); background: var(--panel); }
textarea {
  flex: 1; resize: none; height: 46px; max-height: 160px; padding: 11px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit;
}
textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
button {
  font: inherit; border: 0; border-radius: 8px; cursor: pointer; padding: 6px 12px;
  background: var(--accent); color: var(--accent-ink);
}
button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
button:disabled { opacity: .5; cursor: default; }

/* side panel */
/* BGM on top and the add form at the bottom stay put; only the middle scrolls */
aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
aside .pinned { flex: none; padding: 12px 16px; background: var(--panel); }
aside .pinned.top { border-bottom: 1px solid var(--line); }
aside .pinned.bottom { border-top: 1px solid var(--line); padding-bottom: 14px; }
aside .pinned h2 { margin-top: 0; }
#sidescroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 12px 16px 16px; }
aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 8px; }
#sidescroll h2:first-child { margin-top: 2px; }
.handoff { border: 1px solid var(--accent); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.handoff .t { font-weight: 600; }
.handoff .m { font-size: 12px; color: var(--muted); margin: 2px 0 8px; }
.handoff .row { display: flex; gap: 6px; }
.group { margin-bottom: 10px; }
.group .name { font-size: 12.5px; font-weight: 600; margin: 8px 0 4px; }
.task { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: start; padding: 5px 0; border-bottom: 1px dashed var(--line); }
.task input[type=checkbox] { margin-top: 4px; accent-color: var(--accent); }
.task .title { word-break: break-word; }
.task .meta { font-size: 11.5px; color: var(--muted); }
.task .meta .due { color: var(--due); } .task .meta .over { color: var(--warn); font-weight: 600; }
.task button { padding: 2px 8px; font-size: 12px; }
.task.done .title { text-decoration: line-through; color: var(--muted); }
.task > div { min-width: 0; }
.task button { white-space: nowrap; }
aside { overflow: hidden; }
.task .title { cursor: pointer; }
.task .title:hover { color: var(--accent); }
.task .peek { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task .more { grid-column: 2 / -1; display: grid; gap: 6px; margin: 4px 0 6px; }
.task .more textarea { height: 90px; max-height: none; resize: vertical; font-size: 13px; padding: 8px 10px; }
.task .more .row { display: flex; gap: 6px; }
form#add { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
form#add input[name=title] { grid-column: 1 / -1; }
form#add input, form#add select {
  font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); min-width: 0;
}
form#add button { grid-column: 1 / -1; }
details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; margin-top: 14px; }
</style>
</head>
<body>
<header>
  <h1 title="External Self Agent"><span>E.S.</span> Agent</h1>
  <div id="status"><i></i><span>確認中…</span></div>
  <div id="gstatus" class="pill"><i></i><span>Google ToDo</span></div>
  <div id="modesw" role="group" aria-label="モード">
    <button data-mode="work" title="タスク管理と相談。「何からやる？」で次の一歩を提案します">作業モード</button>
    <button data-mode="talk" title="ただの会話。Es からタスクの話は振りません">雑談モード</button>
  </div>
  <span class="spacer"></span>
  <button id="gconnect" class="ghost" hidden>Google ToDo に接続</button>
  <button id="gsync" class="ghost" hidden>今すぐ同期</button>
  <button id="adminBtn" class="ghost" title="データベースの中身と設定">管理</button>
</header>
<main>
  <section id="chat">
    <section id="scene"></section>
    <div id="log"></div>
    <form id="send">
      <div id="cmdpop" hidden></div>
      <textarea id="input" placeholder="例: 金曜までにA社のES出す / SymphonyKillChordのジャンプのバグ直したい" autofocus></textarea>
      <button id="sendBtn" type="submit">送信</button>
    </form>
  </section>
  <aside>
    <section id="bgm" class="pinned top"></section>
    <div id="sidescroll">
      <h2>Claude Code への引き継ぎ</h2>
      <div id="handoffs"></div>
      <h2>タスク</h2>
      <div id="tasks"></div>
      <details><summary>最近完了したタスク</summary><div id="done"></div></details>
    </div>
    <section class="pinned bottom">
      <h2>追加</h2>
      <form id="add">
        <input name="title" placeholder="タスク名" required>
        <select name="project"></select>
        <input name="due" type="date">
        <button type="submit">追加</button>
      </form>
    </section>
  </aside>
</main>
<script src="/static/companion.js"></script>
<script>
const $ = (s) => document.querySelector(s);
let S = { tasks: [], done: [], projects: [], handoffs: [], messages: [], llm: {} };
let busy = false;
const openTasks = new Set();
const repText = (r) => { const p = r.split(" "); return p[0] === "daily" ? `毎日 ${p[1]}` : `毎週${"月火水木金土日"[+p[1]]} ${p[2]}`; };

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(path, body) {
  const opt = body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json", "X-EsAgent": "1" }, body: JSON.stringify(body),
  };
  let r;
  try { r = await fetch(path, opt); }
  catch (e) { const err = new Error("E.S. Agent のサーバーに接続できません"); err.offline = true; throw err; }
  let data;
  try { data = await r.json(); }
  catch (e) { const err = new Error("返答を受け取れませんでした。再接続を待っています"); err.offline = true; throw err; }
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

async function refresh() {
  try { S = await api("/api/state"); render(); } catch (e) { setStatus(false, "サーバーに接続できません"); }
}

function setStatus(ok, text) {
  $("#status").className = ok ? "ok" : "bad";
  $("#status span").textContent = text;
}

function today() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }

function render() {
  const l = S.llm;
  if (!l.ollama) setStatus(false, "Ollama 未起動（タスク管理だけ使えます）");
  else if (!l.model) setStatus(false, `${l.name} 未ダウンロード`);
  else setStatus(true, `${l.name} 準備OK`);

  renderGoogle(S.google || {});
  window.Es?.update(S);

  const log = $("#log");
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  log.innerHTML = S.messages.length
    ? S.messages.map((m) => `<div class="msg ${esc(m.role)}${m.status === "pending" ? " pending" : ""}">${esc(m.content)}` +
        (m.status === "pending" ? `<small>⏳ 返事待ち — モデルの準備ができたら自動で返事します</small>` : "") + renderChoices(m) + `</div>`).join("")
    : `<div class="empty">Es です。予定やタスク、困っていることを話しかけてください。<br>「/」でコマンド、コードの作業は Claude Code に引き継げます。</div>`;
  log.insertAdjacentHTML("beforeend", `<div id="live"></div>`);
  renderLive();
  if (atBottom || queue.length) log.scrollTop = log.scrollHeight;
  document.querySelectorAll("#modesw [data-mode]").forEach((b) => b.classList.toggle("on", b.dataset.mode === (S.mode || "work")));
  $("#input").placeholder = S.mode === "talk"
    ? "雑談モード：なんでも話してね（タスクの追加・完了もできます）"
    : "作業モード：例「金曜までにA社のES出す」「何からやる？」　/ でスキル";

  $("#handoffs").innerHTML = S.handoffs.length ? S.handoffs.map((h) => `
    <div class="handoff">
      <div class="t">#${h.task_id} ${esc(h.task_title)}</div>
      <div class="m">${esc(h.project || "未分類")} ・ ${h.status === "opened" ? "開いた（結果待ち）" : "未オープン"}</div>
      <div class="row">
        <button data-open="${h.id}">${h.status === "opened" ? "もう一度開く" : "Claude Codeで開く"}</button>
        <button class="ghost" data-dismiss="${h.id}">取り下げ</button>
      </div>
    </div>`).join("") : `<div class="task"><span></span><span class="meta">なし</span></div>`;

  const groups = {};
  for (const t of S.tasks) (groups[t.project || "未分類"] ??= []).push(t);
  const t0 = today();
  const row = (t) => `
    <div class="task ${t.status === "done" ? "done" : ""}">
      <input type="checkbox" ${t.status === "done" ? "checked" : ""} data-toggle="${t.id}" title="完了">
      <div><div class="title" data-expand="${t.id}" title="クリックでメモを開く">#${t.id} ${esc(t.title)}</div>
        ${t.notes && !openTasks.has(t.id) ? `<div class="peek">${esc(t.notes.split("\n").pop())}</div>` : ""}
        <div class="meta">${t.repeat ? `<span class="rep" title="${esc(t.repeat)}">🔁 ${esc(repText(t.repeat))}</span> ・ ` : ""}${t.due ? `<span class="${t.due < t0 ? "over" : "due"}">〆 ${esc(t.due)}</span> ・ ` : ""}${{ todo: "未着手", doing: "進行中", delegated: "Claude Codeに委任", done: "完了" }[t.status] || esc(t.status)}</div></div>
      ${t.status === "done" ? "" : `<button class="ghost" data-delegate="${t.id}" title="Claude Code に引き継ぐ">→ Claude</button>`}
      ${openTasks.has(t.id) ? `<div class="more">
        <textarea data-notes="${t.id}" placeholder="メモ・内容（Claude Code に引き継ぐときにも渡されます）">${esc(t.notes)}</textarea>
        <div class="row"><button data-savenotes="${t.id}">メモを保存</button>
          ${t.status === "done" ? "" : `<button class="ghost" data-focus="${t.id}">Es と集中する</button>`}</div>
      </div>` : ""}
    </div>`;
  $("#tasks").innerHTML = Object.keys(groups).length
    ? Object.entries(groups).map(([name, ts]) => `<div class="group"><div class="name">${esc(name)}</div>${ts.map(row).join("")}</div>`).join("")
    : `<div class="meta">まだタスクはありません</div>`;
  $("#done").innerHTML = S.done.map(row).join("");

  const sel = $("#add select");
  const cur = sel.value;
  sel.innerHTML = `<option value="">プロジェクトなし</option>` + S.projects.map((p) => `<option>${esc(p.name)}</option>`).join("");
  sel.value = cur;
}

function renderGoogle(g) {
  const hhmm = (s) => (s ? s.slice(11, 16) : "");
  const pending = g.pending ? `・未同期 ${g.pending} 件` : "";
  let cls = "", text;
  if (!g.client) text = "Google ToDo: 未設定";
  else if (!g.connected) text = g.last_error ? `Google ToDo: ${g.last_error}` : "Google ToDo: 未接続", cls = g.last_error ? "bad" : "";
  else if (g.state === "online") cls = "ok", text = `Google ToDo: 同期済み ${hhmm(g.last_sync)}${pending}`;
  else if (g.state === "offline") cls = "wait", text = `Google ToDo: オフライン（復帰したら同期）${pending}`;
  else if (g.state === "auth_error" || g.state === "error") cls = "bad", text = `Google ToDo: ${g.last_error}`;
  else cls = "wait", text = "Google ToDo: 同期準備中";
  $("#gstatus").className = cls;
  if (g.connected) {
    if (!g.calendar) text += " ・カレンダー未許可", cls = cls === "ok" ? "wait" : cls;
    else if (g.cal_error) text += ` ・カレンダー: ${g.cal_error}`, cls = "bad";
    else text += " ・カレンダー連携中";
  }
  $("#gstatus span").textContent = text;
  $("#gstatus").title = g.client ? "" : "secrets\\google_client.json を置くと接続できます";
  $("#gconnect").hidden = !g.client || (g.connected && g.calendar);
  $("#gconnect").textContent = g.connected ? "カレンダー連携のため再接続" : "Google ToDo に接続";
  $("#gsync").hidden = !g.connected;
}

$("#gconnect").addEventListener("click", async () => {
  try { await api("/api/google/connect", {}); } catch (err) { alert(err.message); }
});
$("#gsync").addEventListener("click", async () => {
  $("#gsync").disabled = true;
  try { await api("/api/google/sync", {}); } catch (err) { alert(err.message); }
  $("#gsync").disabled = false; refresh();
});
$("#adminBtn").addEventListener("click", () => {
  const w = window.open("/admin", "esagent-admin", "width=1100,height=760");
  if (w) w.focus();
});

// ---- sending: a queue, so you can keep typing while Es is thinking ----------
function renderChoices(message) {
  const offer = S.choices;
  if (!offer || offer.message_id !== message.id) return "";
  const disabled = busy || queue.length ? " disabled" : "";
  return `<div class="chat-choices">${offer.options.map(o => `<button type="button" data-offer="${esc(offer.id)}" data-choice-value="${esc(o.value)}"${disabled}>${esc(o.label)}</button>`).join("")}</div>`;
}

$("#log").addEventListener("click", e => {
  const b = e.target.closest("button[data-offer]");
  if (!b || b.disabled || busy || queue.length || b.dataset.offer !== S.choices?.id) return;
  document.querySelectorAll("button[data-offer]").forEach(x => { x.disabled = true; });
  queue.push({text: b.textContent, at: localIso(), id: requestId(),
    choice: {offer_id: b.dataset.offer, value: b.dataset.choiceValue}});
  saveQueue(); renderLive(); pump();
});

// Messages not yet delivered; queue[0] is in flight while busy. Saved so a reload keeps them.
// Items are {text, at}: at = when send was pressed, so Es can tell how long a message waited (#23).
const requestId = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), n => n.toString(16).padStart(2, "0")).join("");
const queue = (() => { try { return JSON.parse(localStorage.getItem("es.queue") || "[]"); } catch { return []; } })()
  .map((q) => ({ ...(typeof q === "string" ? { text: q, at: null } : q), id: q.id || requestId() }));
const localIso = (d = new Date()) => {
  return d.toISOString(); // retain milliseconds and timezone across queued/replayed requests
};
// Questions about the wait itself ("まだ？") skip the queue; the server answers them at once.
let bypassRe = null;
api("/api/chat/bypass").then((r) => { bypassRe = new RegExp(r.pattern); }).catch(() => {});
const saveQueue = () => { try { localStorage.setItem("es.queue", JSON.stringify(queue)); } catch {} };
saveQueue(); // persist migrated IDs before the first request, including after a reload
let offline = false;
let thinkStart = 0, thinkStage = "", thinkDetail = "", thinkPartial = "", thinkTimer = null, stagePoll = null;

function renderLive() {
  const live = $("#live");
  if (!live) return;
  let html = "";
  queue.forEach(({ text }, i) => {
    if (i === 0 && busy) {
      html += `<div class="msg user">${esc(text)}</div>`;
      const secs = ((performance.now() - thinkStart) / 1000).toFixed(1);
      const label = offline ? "E.S. Agent に再接続を待っています（届いたら返事します）"
        : text.startsWith("/") ? "実行中" : `考え中${thinkStage ? `（${esc(thinkStage)}）` : ""}`;
      html += `<div class="msg thinking"><span class="dots"></span>${label} <b>${secs}s</b>` +
        (thinkDetail ? `<span class="detail">${esc(thinkDetail)}</span>` : "") +
        (thinkPartial ? `<span class="partial">${esc(thinkPartial)}</span>` : "") + `</div>`;
    } else {
      const wait = i === 0 && offline ? "E.S. Agent に再接続を待っています（つながったら自動で送ります）" : "送信待ち";
      html += `<div class="msg user queued">${esc(text)}<small>${wait}</small></div>`;
    }
  });
  live.innerHTML = html;
  const log = $("#log");
  log.scrollTop = log.scrollHeight;
}

async function pump() {
  if (busy) return;
  while (queue.length) {
    busy = true;
    document.querySelectorAll("button[data-offer]").forEach(b => { b.disabled = true; });
    thinkStart = performance.now(); thinkStage = thinkDetail = thinkPartial = "";
    window.Es?.thinking(true);
    thinkTimer = setInterval(renderLive, 100);
    stagePoll = setInterval(async () => {
      try {
        const p = await api("/api/progress");
        if (p.busy) { thinkStage = p.stage || thinkStage; thinkDetail = p.detail || ""; thinkPartial = p.partial || ""; }
      } catch {}
    }, 500);
    renderLive();
    let delivered = true;
    try {
      const r = await api("/api/chat", { text: queue[0].text, queuedAt: queue[0].at, requestId: queue[0].id, choice: queue[0].choice });
      offline = false;
      if (r.pending) window.Es?.say(r.note, { ms: 6000 });
      else window.Es?.react(r);  // a "うん" to a focus offer is started by the server
    } catch (err) {
      if (err.offline) { offline = true; delivered = false; }   // keep it and try again
      else window.Es?.say(`送れなかった… ${err.message}`, { ms: 6000 });
    }
    clearInterval(thinkTimer); clearInterval(stagePoll);
    window.Es?.thinking(false);
    if (!delivered) {
      busy = false;
      renderLive();
      setTimeout(pump, 3000);
      return;
    }
    queue.shift();
    saveQueue();
    busy = false;
    await refresh();
  }
}

$("#send").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("#input").value.trim();
  if (!text) return;
  $("#input").value = ""; hidePop();
  if (busy && bypassRe && bypassRe.test(text) && !text.startsWith("/")) {
    api("/api/chat", { text, queuedAt: localIso(), requestId: requestId() })
      .then((r) => { window.Es?.say(r.reply, { ms: 9000 }); return refresh(); })
      .catch((err) => window.Es?.say(`送れなかった… ${err.message}`, { ms: 6000 }));
    $("#input").focus();
    return;
  }
  queue.push({ text, at: localIso(), id: requestId() });
  saveQueue();
  renderLive();
  pump();
  $("#input").focus();
});

// ---- slash command autocomplete --------------------------------------------
let CMDS = [], popItems = [], popSel = 0;
api("/api/commands").then((c) => (CMDS = c)).catch(() => {});

function hidePop() { $("#cmdpop").hidden = true; popItems = []; }

function updatePop() {
  const v = $("#input").value;
  if (!v.startsWith("/") || v.includes(" ") || v.includes("\n")) return hidePop();
  popItems = CMDS.filter((c) => c.name.startsWith(v.toLowerCase()));
  if (!popItems.length) return hidePop();
  popSel = Math.min(popSel, popItems.length - 1);
  $("#cmdpop").innerHTML = popItems.map((c, i) =>
    `<div class="cmd ${i === popSel ? "sel" : ""}" data-cmd="${esc(c.name)}"><b>${esc(c.name)}</b> <span class="args">${esc(c.args)}</span><span class="desc">${esc(c.desc)}</span></div>`).join("");
  $("#cmdpop").hidden = false;
}

function pickCmd(name) {
  $("#input").value = name + " ";
  hidePop(); $("#input").focus();
}

$("#input").addEventListener("input", () => { popSel = 0; updatePop(); });
$("#cmdpop").addEventListener("mousedown", (e) => {
  const el = e.target.closest("[data-cmd]");
  if (el) { e.preventDefault(); pickCmd(el.dataset.cmd); }
});

$("#input").addEventListener("keydown", (e) => {
  const open = !$("#cmdpop").hidden && popItems.length;
  if (open && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault();
    popSel = (popSel + (e.key === "ArrowDown" ? 1 : popItems.length - 1)) % popItems.length;
    return updatePop();
  }
  if (open && e.key === "Escape") return hidePop();
  if (open && (e.key === "Tab" || (e.key === "Enter" && !e.isComposing && $("#input").value !== popItems[popSel].name))) {
    e.preventDefault();
    return pickCmd(popItems[popSel].name);
  }
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#send").requestSubmit(); }
});

$("#add").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  await api("/api/tasks", { title: f.get("title"), project: f.get("project"), due: f.get("due") });
  e.target.title.value = ""; e.target.due.value = "";
  refresh();
});

document.addEventListener("click", async (e) => {
  const d = e.target.dataset;
  if (d.mode && e.target.closest("#modesw")) {
    if (d.mode === S.mode) return;
    try { await api("/api/mode", { mode: d.mode }); } catch (err) { alert(err.message); }
    return refresh();
  }
  try {
    if (d.expand) { const id = +d.expand; openTasks.has(id) ? openTasks.delete(id) : openTasks.add(id); return render(); }
    if (d.focus) return window.Es?.focusOn(d.focus);
    if (d.savenotes) {
      const ta = document.querySelector(`[data-notes="${d.savenotes}"]`);
      await api(`/api/tasks/${d.savenotes}`, { notes: ta.value });
      window.Es?.say("メモ、残しておいたよ。", { ms: 2500 });
    }
    else if (d.open) await api(`/api/handoffs/${d.open}/open`, {});
    else if (d.dismiss) await api(`/api/handoffs/${d.dismiss}/dismiss`, {});
    else if (d.delegate) await api(`/api/tasks/${d.delegate}/delegate`, {});
    else return;
  } catch (err) { alert(err.message); }
  refresh();
});

document.addEventListener("change", async (e) => {
  const id = e.target.dataset.toggle;
  if (!id) return;
  await api(`/api/tasks/${id}`, { status: e.target.checked ? "done" : "todo" });
  refresh();
});

window.EsHooks = { refresh };
if (queue.length) setTimeout(pump, 500);  // messages left over from before a reload
window.Es?.init();
refresh();
// Do not re-render while a note is being edited, or the text box would reset.
setInterval(() => { if (!busy && !document.activeElement?.matches?.("[data-notes]")) refresh(); }, 8000);
</script>
