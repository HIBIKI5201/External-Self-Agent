name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python syntax
        run: python -m compileall -q esagent tests
      - name: JavaScript syntax
        run: node --check esagent/static/companion.js && node --check esagent/static/listen.js && node --check esagent/static/calendar.js
      - name: Chat queue retry tests
        run: node tests/test_chat_queue.js
      - name: Voice chat echo tests
        run: node tests/test_listen.js
      - name: Calendar pane tests
        run: node tests/test_calendar_pane.js
      - name: Calendar day tests
        run: node tests/test_calendar_days.js
      - name: Task list fold tests
        run: node tests/test_task_fold.js
      - name: Narrow window layout tests
        run: node tests/test_layout_toggle.js
      - name: JSON files
        shell: bash
        run: for f in config.example.json spec/domains/*.json .claude/settings.json; do python -m json.tool "$f" > /dev/null || exit 1; done
      - name: Offline tests (no model, fake Google)
        run: python tests/run.py --offline

  # Cloud Claude Code sessions run on Linux without tkinter; keep the offline tests runnable there (#204).
  offline-linux:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline tests (no model, fake Google; Windows-only modules skipped)
        run: python tests/run.py --offline
