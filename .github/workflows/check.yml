name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python syntax
        run: python -m compileall -q esagent tests
      - name: JavaScript syntax
        run: node --check esagent/static/companion.js
      - name: JSON files
        shell: bash
        run: for f in config.example.json spec/domains/*.json .claude/settings.json; do python -m json.tool "$f" > /dev/null || exit 1; done
      - name: Offline tests (no model, fake Google)
        run: python tests/run.py --offline
